<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password - Attendance Analysis System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            font-family: "Segoe UI", Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-size: 9pt;
        }
        .login-wrapper {
            background: #ffffff;
            border: 1px solid #a0a0a0;
            box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.08);
            width: 850px;
            max-width: 95%;
            display: flex;
            border-radius: 4px;
            overflow: hidden;
        }
        .brand-section {
            background: #e9ecef;
            border-right: 1px solid #d0d0d0;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        .form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .form-control {
            border-radius: 0;
            border: 1px solid #ced4da;
            padding: 10px;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .form-control:focus {
            box-shadow: none;
            border-color: #6c757d;
        }
        .validation-error {
            font-size: 0.75rem;
            font-weight: 600;
            color: #dc3545;
            margin-top: 4px;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <!-- Brand / Logo Section -->
        <div class="brand-section">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SUD Logo" style="max-height: 90px; margin-bottom: 20px;" onerror="this.style.display='none'">
            <h4 class="fw-bold text-dark mb-2" style="font-family: Arial, sans-serif;">Attendance Analysis System</h4>
            <p class="text-muted small mb-0">Safwa Urban Development (SUD)</p>
        </div>

        <!-- Change Password Form Section -->
        <div class="form-section">
            <h4 class="fw-bold mb-4 text-secondary" style="font-family: 'Segoe UI', Tahoma, sans-serif;">Change Password</h4>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} py-2 text-center small rounded-0">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('changepassword') }}">
                <!-- Required CSRF Token to prevent Bad Request errors -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                <!-- New Password Field with dynamic JS validation -->
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">New Password</label>
                    <input type="password" name="new_password" class="form-control" required
                           oninput="document.getElementById('changePwdErr').innerText = '';"
                           onblur="validatePassword(this, 'changePwdErr')">
                    <div id="changePwdErr" class="validation-error"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-secondary rounded-0 w-100 mt-2 py-2">Update Password</button>
                <div class="text-center mt-3">
                    <a href="{{ url_for('dashboard') }}" class="text-secondary small text-decoration-none">← Back to Dashboard</a>
                </div>
            </form>
        </div>
    </div>

<!-- FRONTEND VALIDATION SCRIPTS -->
<script>
    function validatePassword(input, errorId) {
        const val = input.value;
        const errDiv = document.getElementById(errorId);

        if (!val) return;

        if (val.length < 4) { errDiv.innerText = "Must be at least 4 characters long."; return; }
        if (/\s/.test(val)) { errDiv.innerText = "Cannot contain spaces."; return; }
        if (!/^[A-Za-z]/.test(val)) { errDiv.innerText = "Must start with a letter."; return; }
        if (!/[a-z]/.test(val)) { errDiv.innerText = "Needs at least 1 lowercase letter."; return; }
        if (!/[A-Z]/.test(val)) { errDiv.innerText = "Needs at least 1 uppercase letter."; return; }
        if (!/[0-9]/.test(val)) { errDiv.innerText = "Needs at least 1 number."; return; }
    }
</script>

</body>
</html>
